<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>縦書きPDF 画像リフロー・文字切断防止</title>
<style>
:root{--bg:#f5f5f2;--panel:#fff;--ink:#191919;--line:#d8d8d3;--shadow:0 12px 36px rgba(0,0,0,.18)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input{font:inherit}
main{position:fixed;left:0;right:0;top:0;bottom:calc(54px + env(safe-area-inset-bottom));overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x;background:var(--bg)}
#reader{height:100%;display:flex;flex-direction:row-reverse;align-items:flex-start;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;width:max-content;min-width:100%}
.col{display:block;flex:none;background:#fff}
.placeholder{width:100vw;padding:88px 28px 40px;text-align:center;color:#777;line-height:1.8;font-size:14px}
#bottomBar{position:fixed;z-index:50;left:0;right:0;bottom:0;height:calc(54px + env(safe-area-inset-bottom));display:flex;align-items:flex-start;justify-content:space-between;padding:7px calc(10px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(12px + env(safe-area-inset-left));background:rgba(245,245,242,.96);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.10)}
#settingsButton{position:static;flex:none;width:38px;height:38px;border:1px solid rgba(0,0,0,.2);border-radius:50%;background:rgba(255,255,255,.98);box-shadow:0 1px 6px rgba(0,0,0,.08);font-size:19px;line-height:1;padding:0;color:#222}
#pageBadge{position:static;align-self:center;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:4px 9px;font-size:11px;color:#555;font-variant-numeric:tabular-nums;pointer-events:none}
#settingsOverlay{position:fixed;z-index:60;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;justify-content:center;padding:0}
#settingsOverlay.open{display:flex}
#settingsPanel{width:min(640px,100%);max-height:86dvh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.panelHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.panelHead strong{font-size:17px}
.iconBtn{width:38px;height:38px;border:1px solid #c9c9c5;border-radius:11px;background:#fff;font-size:22px;line-height:1;padding:0}
.file{position:relative;display:block;overflow:hidden;margin-bottom:10px}
.file input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.file span,.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #c2c2be;border-radius:12px;background:#fff;padding:0 12px;font-weight:650;font-size:14px}
.file span:active,.btn:active,.iconBtn:active{background:#ecece8}
.pageRow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:13px}
.pageRow .btn{min-height:42px}
.pageInfo{font-size:13px;color:#555;white-space:nowrap;text-align:center;min-width:76px}
.setting{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin:11px 0}
.setting label{font-size:13px;color:#444}
.setting output{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.setting input[type=range]{grid-column:1/3;width:100%;accent-color:#222}
.help{font-size:11px;color:#777;line-height:1.55;margin-top:7px}
.divider{height:1px;background:#e3e3df;margin:12px 0}
.status{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:#111;color:#fff;padding:8px 13px;border-radius:99px;font-size:12px;display:none;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<main id="main">
  <div id="reader"><div class="placeholder">画面下の⚙を押してPDFを選択してください。<br>本文の縦書きを画像のまま拡大し、iPhoneの画面高に合わせてリフローします。</div></div>
</main>
<div id="bottomBar" aria-label="読書操作">
  <div id="pageBadge">— / —</div>
  <button id="settingsButton" aria-label="設定">⚙</button>
</div>

<div id="settingsOverlay" aria-hidden="true">
  <section id="settingsPanel" role="dialog" aria-modal="true" aria-label="設定">
    <div class="panelHead"><strong>設定</strong><button class="iconBtn" id="closeSettings" aria-label="閉じる">×</button></div>
    <label class="file"><span id="fileLabel">PDFを選択</span><input id="pdfFile" type="file" accept="application/pdf"></label>
    <div class="pageRow">
      <button class="btn" id="prev">前のページ</button>
      <span class="pageInfo" id="pageInfo">— / —</span>
      <button class="btn" id="next">次のページ</button>
    </div>

    <div class="setting">
      <label for="zoom">文字の拡大率</label><output id="zoomOut">160%</output>
      <input id="zoom" type="range" min="100" max="300" value="160" step="10">
    </div>

    <div class="divider"></div>

    <div class="setting">
      <label for="topCrop">上端を無視</label><output id="topOut">7%</output>
      <input id="topCrop" type="range" min="0" max="20" value="7" step="1">
    </div>
    <div class="setting">
      <label for="bottomCrop">下端を無視</label><output id="bottomOut">7%</output>
      <input id="bottomCrop" type="range" min="0" max="20" value="7" step="1">
    </div>
    <div class="setting">
      <label for="gap">リフロー後の列間隔</label><output id="gapOut">10px</output>
      <input id="gap" type="range" min="0" max="30" value="10" step="1">
    </div>
    <div class="setting">
      <label for="splitSensitivity">列を分ける感度</label><output id="splitOut">75%</output>
      <input id="splitSensitivity" type="range" min="40" max="100" value="75" step="5">
    </div>
    <div class="help">白い余白そのものは文字としてリフローしません。文字の上下が分断されないよう、文字間の安全な白い谷を探してから分割します。改行は列途中の空白では判定せず、原文で次の縦列が約1文字下がって始まる場合、または「のような行頭記号らしい形で始まる場合を優先して段落先頭として扱います。</div>
    <div class="help">選択したPDFと最後に読んだページはこの端末内に自動保存されます。次回はPDFを選び直さず、続きのページから再開します。</div>
  </section>
</div>

<div class="status" id="status"></div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.worker.min.mjs';

const $=id=>document.getElementById(id);
const file=$('pdfFile');
const reader=$('reader');
const main=$('main');
const status=$('status');
const overlay=$('settingsOverlay');
let pdf=null,pageNo=1,sourceCanvas=null,timer=null,renderToken=0;
let touchStart=null;

// PDF本体はIndexedDB、ページ番号と設定はlocalStorageへ保存する。
const DB_NAME='verticalPdfReflowDB';
const DB_VERSION=1;
const STORE_NAME='books';
const BOOK_KEY='currentBook';
const STATE_KEY='verticalPdfReflowStateV2';
let currentFileName='';

function readSavedState(){
  try{
    return JSON.parse(localStorage.getItem(STATE_KEY)||'{}')||{};
  }catch(e){
    console.warn('保存状態を読み込めませんでした',e);
    return {};
  }
}

function applySavedSettings(){
  const s=readSavedState();
  const ids=['zoom','topCrop','bottomCrop','gap','splitSensitivity'];
  for(const id of ids){
    if(s[id]===undefined)continue;
    const el=$(id);
    const n=Number(s[id]);
    if(!Number.isFinite(n))continue;
    const min=Number(el.min),max=Number(el.max);
    el.value=String(Math.max(min,Math.min(max,n)));
  }
}

function saveState(){
  try{
    const s={
      pageNo,
      zoom:+$('zoom').value,
      topCrop:+$('topCrop').value,
      bottomCrop:+$('bottomCrop').value,
      gap:+$('gap').value,
      splitSensitivity:+$('splitSensitivity').value,
      fileName:currentFileName,
      updatedAt:Date.now()
    };
    localStorage.setItem(STATE_KEY,JSON.stringify(s));
  }catch(e){
    console.warn('読書位置を保存できませんでした',e);
  }
}

function openBookDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){
      reject(new Error('IndexedDB非対応'));
      return;
    }
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME,{keyPath:'id'});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('IndexedDBを開けませんでした'));
  });
}

async function savePdfToDevice(blob,name){
  const db=await openBookDB();
  try{
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_NAME,'readwrite');
      tx.objectStore(STORE_NAME).put({id:BOOK_KEY,blob,name:name||'保存したPDF',savedAt:Date.now()});
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error('PDFを保存できませんでした'));
      tx.onabort=()=>reject(tx.error||new Error('PDFの保存が中断されました'));
    });
  }finally{
    db.close();
  }
}

async function loadPdfFromDevice(){
  const db=await openBookDB();
  try{
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_NAME,'readonly');
      const req=tx.objectStore(STORE_NAME).get(BOOK_KEY);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error||new Error('保存したPDFを読み込めませんでした'));
    });
  }finally{
    db.close();
  }
}

async function requestPersistentStorage(){
  try{
    if(navigator.storage&&navigator.storage.persist){
      await navigator.storage.persist();
    }
  }catch(e){
    console.warn('永続ストレージを要求できませんでした',e);
  }
}

function openSettings(){overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}
function closeSettings(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true')}
$('settingsButton').onclick=openSettings;
$('closeSettings').onclick=closeSettings;
overlay.addEventListener('click',e=>{if(e.target===overlay)closeSettings()});

function toast(s){
  status.textContent=s;
  status.style.display='block';
  clearTimeout(status._t);
  status._t=setTimeout(()=>status.style.display='none',1700);
}

function sync(){
  $('zoomOut').value=$('zoom').value+'%';
  $('topOut').value=$('topCrop').value+'%';
  $('bottomOut').value=$('bottomCrop').value+'%';
  $('gapOut').value=$('gap').value+'px';
  $('splitOut').value=$('splitSensitivity').value+'%';
}

applySavedSettings();
['zoom','topCrop','bottomCrop','gap','splitSensitivity'].forEach(id=>{
  $(id).addEventListener('input',()=>{
    sync();
    saveState();
    clearTimeout(timer);
    timer=setTimeout(()=>sourceCanvas&&reflow(),120);
  });
});
sync();

file.addEventListener('change',async()=>{
  if(!file.files[0])return;
  try{
    const selected=file.files[0];
    toast('PDFを読み込み中…');
    const data=await selected.arrayBuffer();
    const loadedPdf=await pdfjsLib.getDocument({data}).promise;
    pdf=loadedPdf;
    pageNo=1;
    currentFileName=selected.name||'保存したPDF';
    $('fileLabel').textContent=currentFileName;
    await savePdfToDevice(selected,currentFileName);
    saveState();
    await requestPersistentStorage();
    await renderPage();
    closeSettings();
    toast('PDFと読書位置を保存しました');
  }catch(e){
    console.error(e);
    toast('PDFを読み込めませんでした');
  }
});

$('prev').onclick=()=>go(-1);
$('next').onclick=()=>go(1);

async function go(d){
  if(!pdf)return;
  const n=Math.max(1,Math.min(pdf.numPages,pageNo+d));
  if(n===pageNo)return;
  pageNo=n;
  saveState();
  await renderPage();
}

async function renderPage(){
  const token=++renderToken;
  toast('文字列と安全な切れ目を解析中…');
  const p=await pdf.getPage(pageNo);
  const vp=p.getViewport({scale:2.2});
  const c=document.createElement('canvas');
  c.width=Math.ceil(vp.width);
  c.height=Math.ceil(vp.height);
  await p.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp}).promise;
  if(token!==renderToken)return;
  sourceCanvas=c;
  const info=pageNo+' / '+pdf.numPages;
  $('pageInfo').textContent=info;
  $('pageBadge').textContent=info;
  saveState();
  reflow();
}

function percentile(values,q){
  if(!values.length)return 0;
  const a=Array.from(values).sort((x,y)=>x-y);
  return a[Math.min(a.length-1,Math.max(0,Math.floor((a.length-1)*q)))];
}

function smoothArray(src,radius){
  const n=src.length,out=new Float32Array(n),sum=new Float64Array(n+1);
  for(let i=0;i<n;i++)sum[i+1]=sum[i]+src[i];
  for(let i=0;i<n;i++){
    const a=Math.max(0,i-radius),b=Math.min(n,i+radius+1);
    out[i]=(sum[b]-sum[a])/(b-a);
  }
  return out;
}

function closeSmallHoles(mask,maxHole){
  const out=Uint8Array.from(mask);
  let i=0;
  while(i<out.length){
    if(out[i]){i++;continue;}
    const s=i;
    while(i<out.length&&!out[i])i++;
    const len=i-s;
    if(s>0&&i<out.length&&len<=maxHole){
      for(let j=s;j<i;j++)out[j]=1;
    }
  }
  return out;
}

function runsFromMask(mask,minWidth){
  const runs=[];
  let s=-1;
  for(let i=0;i<=mask.length;i++){
    const on=i<mask.length&&mask[i];
    if(on&&s<0)s=i;
    if(!on&&s>=0){
      if(i-s>=minWidth)runs.push([s,i]);
      s=-1;
    }
  }
  return runs;
}

function inkProjectionX(ctx,x0,y0,w,h){
  const im=ctx.getImageData(x0,y0,w,h),d=im.data;
  const proj=new Float32Array(w);
  for(let y=0;y<h;y+=2){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const lum=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;
      if(lum<205)proj[x]++;
    }
  }
  return proj;
}

function splitWideRun(run,smoothed,typical,sensitivity){
  const [a,b]=run;
  const width=b-a;
  if(width<=typical*1.48)return [run];
  const edge=Math.max(3,Math.round(typical*.38));
  let minX=-1,minV=Infinity;
  for(let x=a+edge;x<=b-edge;x++){
    if(smoothed[x]<minV){minV=smoothed[x];minX=x;}
  }
  if(minX<0)return [run];
  let localPeak=0;
  for(let x=a;x<b;x++)if(smoothed[x]>localPeak)localPeak=smoothed[x];
  const valleyRatio=localPeak?minV/localPeak:1;
  const allowed=.16+(sensitivity/100)*.48;
  const force=width>typical*2.05;
  if(!force&&valleyRatio>allowed)return [run];
  const left=[a,minX],right=[minX,b];
  if(left[1]-left[0]<typical*.38||right[1]-right[0]<typical*.38)return [run];
  return [
    ...splitWideRun(left,smoothed,typical,sensitivity),
    ...splitWideRun(right,smoothed,typical,sensitivity)
  ];
}

function findColumns(c,y0,h){
  const ctx=c.getContext('2d',{willReadFrequently:true});
  const w=c.width;
  const raw=inkProjectionX(ctx,0,y0,w,h);
  const radius=Math.max(1,Math.round(w/1000));
  const p=smoothArray(raw,radius);
  const positive=Array.from(p).filter(v=>v>0);
  if(!positive.length)return [];
  const peak=percentile(positive,.98);
  const sensitivity=+$('splitSensitivity').value;
  const threshold=peak*(.07+(sensitivity/100)*.06);
  let mask=new Uint8Array(w);
  for(let x=0;x<w;x++)mask[x]=p[x]>threshold?1:0;
  mask=closeSmallHoles(mask,Math.max(1,Math.round(w*.0018)));
  let runs=runsFromMask(mask,Math.max(3,Math.round(w*.003)));
  if(!runs.length)return [];

  const widths=runs.map(r=>r[1]-r[0]);
  const p40=percentile(widths,.40);
  const narrow=widths.filter(v=>v<=Math.max(p40,1));
  let typical=percentile(narrow.length?narrow:widths,.55)||Math.max(6,w*.02);
  typical=Math.max(5,typical);

  const split=[];
  for(const r of runs)split.push(...splitWideRun(r,p,typical,sensitivity));
  const minCol=Math.max(4,typical*.40);
  return split.filter(r=>r[1]-r[0]>=minCol).sort((a,b)=>b[0]-a[0]);
}

// 各縦列について、実際に文字がある上下範囲だけを抽出する。
// 空白そのものは文字として運ばない。行頭判定に必要な上下余白量だけ数値として保持する。
function otsuThreshold(gray){
  const hist=new Uint32Array(256);
  for(let i=0;i<gray.length;i++)hist[gray[i]]++;
  const total=gray.length;
  let sum=0;
  for(let i=0;i<256;i++)sum+=i*hist[i];
  let sumB=0,wB=0,maxVar=-1,threshold=180;
  for(let t=0;t<256;t++){
    wB+=hist[t];
    if(!wB)continue;
    const wF=total-wB;
    if(!wF)break;
    sumB+=t*hist[t];
    const mB=sumB/wB;
    const mF=(sum-sumB)/wF;
    const diff=mB-mF;
    const between=wB*wF*diff*diff;
    if(between>maxVar){maxVar=between;threshold=t;}
  }
  // スキャン原稿では極端な閾値を避ける。
  return Math.max(135,Math.min(225,threshold+8));
}

function dilateRows(mask,radius){
  const n=mask.length,out=new Uint8Array(n),sum=new Uint32Array(n+1);
  for(let i=0;i<n;i++)sum[i+1]=sum[i]+(mask[i]?1:0);
  for(let i=0;i<n;i++){
    const a=Math.max(0,i-radius),b=Math.min(n,i+radius+1);
    out[i]=(sum[b]-sum[a])>0?1:0;
  }
  return out;
}

function makeSafeCutData(rowInk,contentTop,contentBottom,estimatedChar,sw){
  const n=contentBottom-contentTop;
  const local=new Float32Array(n);
  for(let i=0;i<n;i++)local[i]=rowInk[contentTop+i];

  // 1文字の内部にある細い白線や、スキャンのかすれによる隙間を文字間と誤認しないようにする。
  // 行ごとの黒画素数を少し平滑化し、ある程度まとまった高さの白帯だけを切れ目候補にする。
  const smoothed=smoothArray(local,1);
  const positive=Array.from(smoothed).filter(v=>v>0);
  const localPeak=positive.length?percentile(positive,.86):0;
  const activeThreshold=Math.max(1,Math.min(sw*.11,localPeak*.16));
  let active=new Uint8Array(n);
  for(let i=0;i<n;i++)active[i]=smoothed[i]>=activeThreshold?1:0;

  // 文字の中の空洞や濁点・半濁点との隙間はつなげて扱う。
  const guard=Math.max(2,Math.round(estimatedChar*.16));
  const guarded=dilateRows(active,guard);

  const cutPoints=[0];
  const minBlankRun=Math.max(3,Math.round(estimatedChar*.16));
  let i=0;
  while(i<n){
    if(guarded[i]){i++;continue;}
    const a=i;
    while(i<n&&!guarded[i])i++;
    const b=i;
    if(b-a>=minBlankRun){
      const cp=Math.round((a+b)/2);
      if(cp>2&&cp<n-2)cutPoints.push(cp);
    }
  }
  cutPoints.push(n);
  cutPoints.sort((a,b)=>a-b);

  // 強制切断が必要な場合は、その行だけでなく上下の広い範囲も見て安全性を評価する。
  const seamScore=new Float32Array(n);
  const seamRadius=Math.max(2,Math.round(estimatedChar*.20));
  const prefix=new Float64Array(n+1);
  for(let y=0;y<n;y++)prefix[y+1]=prefix[y]+smoothed[y];
  for(let y=0;y<n;y++){
    const a=Math.max(0,y-seamRadius),b=Math.min(n,y+seamRadius+1);
    seamScore[y]=(prefix[b]-prefix[a])/(b-a);
  }
  return {cutPoints,seamScore};
}

// 各縦列について、実際に文字がある上下範囲だけを抽出する。
// 文字の上下を別々に判定せず、薄い線や濁点を含めて一つの文字列画像として扱う。
function analyzeSourceColumn(c,x0,x1,y0,y1){
  const ctx=c.getContext('2d',{willReadFrequently:true});
  const colW=x1-x0;
  const padX=Math.max(3,Math.round(colW*.14));
  const sx=Math.max(0,x0-padX);
  const sw=Math.min(c.width-sx,colW+padX*2);
  const h=y1-y0;
  const im=ctx.getImageData(sx,y0,sw,h),d=im.data;
  const gray=new Uint8Array(sw*h);
  for(let p=0,j=0;p<d.length;p+=4,j++)gray[j]=Math.round((d[p]*299+d[p+1]*587+d[p+2]*114)/1000);
  const inkThreshold=otsuThreshold(gray);
  const rowInk=new Float32Array(h);

  for(let y=0;y<h;y++){
    let n=0;
    const off=y*sw;
    for(let x=0;x<sw;x++)if(gray[off+x]<=inkThreshold)n++;
    rowInk[y]=n;
  }

  const estimatedChar=Math.max(8,colW*1.05);
  const smooth=smoothArray(rowInk,1);
  const positive=Array.from(smooth).filter(v=>v>0);
  if(!positive.length)return null;
  const peak=percentile(positive,.90);
  const threshold=Math.max(.5,Math.min(sw*.06,peak*.025));
  let contentMask=new Uint8Array(h);
  for(let y=0;y<h;y++)contentMask[y]=smooth[y]>=threshold?1:0;

  // 文字の一部が離れていても本文範囲から落ちないよう、上下方向に統合する。
  contentMask=closeSmallHoles(contentMask,Math.max(2,Math.round(estimatedChar*.34)));

  let first=-1,last=-1;
  for(let y=0;y<h;y++){if(contentMask[y]){first=y;break;}}
  for(let y=h-1;y>=0;y--){if(contentMask[y]){last=y;break;}}
  if(first<0||last<first)return null;

  // 上下の細い画や濁点を切り落とさないよう従来より余白を多めに確保する。
  const padY=Math.max(2,Math.round(estimatedChar*.22));
  const contentTop=Math.max(0,first-padY);
  const contentBottom=Math.min(h,last+1+padY);
  const trailingBlank=Math.max(0,h-(last+1));
  const leadingBlank=Math.max(0,first);

  // 行頭の「を画像だけで補助判定する。
  const glyphH=Math.max(4,Math.min(h-first,Math.round(estimatedChar*1.05)));
  let gx0=sw,gy0=glyphH,gx1=-1,gy1=-1,inkCount=0;
  for(let yy=0;yy<glyphH;yy++){
    const y=first+yy;
    const off=y*sw;
    for(let x=0;x<sw;x++){
      if(gray[off+x]<=Math.max(120,inkThreshold-18)){
        inkCount++;
        if(x<gx0)gx0=x;
        if(x>gx1)gx1=x;
        if(yy<gy0)gy0=yy;
        if(yy>gy1)gy1=yy;
      }
    }
  }
  const glyphBoxH=gy1>=gy0?(gy1-gy0+1):glyphH;
  const glyphBoxW=gx1>=gx0?(gx1-gx0+1):sw;
  const glyphDensity=inkCount/Math.max(1,sw*glyphH);
  const firstGlyphQuoteLike=
    inkCount>2 &&
    glyphBoxH<estimatedChar*.68 &&
    glyphBoxW<sw*.78 &&
    glyphDensity<.16;

  const safe=makeSafeCutData(rowInk,contentTop,contentBottom,estimatedChar,sw);

  return {
    sx,sw,
    sy:y0+contentTop,
    sh:contentBottom-contentTop,
    leadingBlank,
    trailingBlank,
    estimatedChar,
    firstGlyphQuoteLike,
    paragraphBreakBefore:false,
    indentStart:false,
    cutPoints:safe.cutPoints,
    seamScore:safe.seamScore
  };
}

function buildSourceColumns(c,cols,y0,y1){
  const out=[];
  for(const [x0,x1] of cols){
    const a=analyzeSourceColumn(c,x0,x1,y0,y1);
    if(a&&a.sh>3)out.push(a);
  }
  if(!out.length)return out;

  // ページ全体に共通する上下余白を差し引いてから、約1文字分の字下げを判定する。
  const leads=out.map(v=>v.leadingBlank);
  const trails=out.map(v=>v.trailingBlank);
  const baseLead=percentile(leads,.18);
  const baseTrail=percentile(trails,.18);

  for(let i=0;i<out.length;i++){
    const cur=out[i];
    const charH=Math.max(8,cur.estimatedChar);
    const extraLead=Math.max(0,cur.leadingBlank-baseLead);
    const indented=extraLead>=charH*.55 && extraLead<=charH*1.65;
    cur.indentStart=indented;

    if(i===0){
      cur.paragraphBreakBefore=false;
      continue;
    }

    const prev=out[i-1];
    const prevChar=Math.max(8,prev.estimatedChar);
    const extraTrail=Math.max(0,prev.trailingBlank-baseTrail);

    // 改行は次の3条件に限定する。
    // 1) 次列が約1文字分下がって始まる。
    // 2) 次列先頭が「らしい小さな字形で始まる。
    // 3) 前列末尾に通常より1文字以上の明確な空きがある。
    const endedEarly=extraTrail>=prevChar*.95;
    cur.paragraphBreakBefore=indented || cur.firstGlyphQuoteLike || endedEarly;
  }
  return out;
}

function chooseTake(src,offset,limit){
  const remain=src.sh-offset;
  if(remain<=limit+.5)return remain;

  const charH=Math.max(8,src.estimatedChar);
  const minTake=Math.min(limit,Math.max(charH*.52,10));
  const target=Math.min(src.sh,offset+limit);
  const softTarget=Math.max(offset+minTake,target-charH*.25);
  const minCp=offset+minTake;

  // 最優先は、十分な高さの白帯の中央で切ること。
  let best=-1;
  for(const cp of src.cutPoints){
    if(cp<=minCp)continue;
    if(cp<=softTarget)best=cp;
    else break;
  }
  if(best>offset)return best-offset;

  // 目標より少し手前まで含めて、上下方向に広く見た安全度が最小の位置を探す。
  const score=src.seamScore;
  if(score&&score.length){
    const lo=Math.max(Math.ceil(minCp),Math.floor(target-charH*1.8));
    const hi=Math.max(lo,Math.floor(target-charH*.30));
    let bestY=-1,bestScore=Infinity;
    for(let y=lo;y<=hi&&y<score.length;y++){
      const distancePenalty=(softTarget-y)/(charH*10);
      const v=score[y]+Math.max(0,distancePenalty);
      if(v<bestScore){bestScore=v;bestY=y;}
    }
    if(bestY>offset+3)return bestY-offset;

    // それでも安全な位置が見つからなければ、もっと短めに切って文字の分断を避ける。
    const hi2=Math.max(Math.ceil(minCp),Math.floor(target-charH*.9));
    bestY=-1;bestScore=Infinity;
    for(let y=Math.ceil(minCp);y<=hi2&&y<score.length;y++){
      const v=score[y]+(hi2-y)/(charH*20);
      if(v<bestScore){bestScore=v;bestY=y;}
    }
    if(bestY>offset+3)return bestY-offset;
  }

  // 最後の保険。1文字近く余らせても、文字を上下に裂かない側を優先する。
  const conservative=Math.max(minTake,limit-charH*1.10);
  return Math.max(3,Math.min(remain,conservative));
}

// 原稿列を読み順に流す。
// 原稿の通常の列境界は連続して詰めるが、段落先頭だけは新しい出力列から始める。
function renderFlow(c,sourceCols,zoom,usableH,gap){
  reader.innerHTML='';
  reader.style.gap=gap+'px';
  const targetSrcH=Math.max(40,usableH/zoom);
  let colIndex=0;
  let offset=0;
  let outCount=0;

  while(colIndex<sourceCols.length){
    let need=targetSrcH;
    let used=0;
    const chunks=[];
    let maxW=0;

    while(need>.5&&colIndex<sourceCols.length){
      const src=sourceCols[colIndex];

      // 段落先頭は原文の改行を保持し、前段落の末尾へ流し込まない。
      if(offset===0&&src.paragraphBreakBefore&&chunks.length)break;

      // 1文字字下げの段落は、白い画像をコピーせず意味のある1文字分だけ空ける。
      if(offset===0&&src.indentStart&&used===0){
        const indent=Math.min(need,src.estimatedChar);
        used+=indent;
        need-=indent;
      }

      const take=chooseTake(src,offset,need);
      if(take<=.5)break;

      chunks.push({src,sourceY:src.sy+offset,sourceH:take,destY:used});
      maxW=Math.max(maxW,src.sw);
      used+=take;
      need-=take;
      offset+=take;

      if(offset>=src.sh-.5){
        colIndex++;
        offset=0;
      }
    }

    if(!chunks.length){
      // 字下げだけで高さを使い切るような異常値を避ける。
      if(colIndex<sourceCols.length){
        const src=sourceCols[colIndex];
        const take=chooseTake(src,offset,targetSrcH);
        if(take>.5){
          chunks.push({src,sourceY:src.sy+offset,sourceH:take,destY:0});
          maxW=Math.max(maxW,src.sw);
          used=take;
          offset+=take;
          if(offset>=src.sh-.5){colIndex++;offset=0;}
        }else{
          colIndex++;offset=0;continue;
        }
      }else break;
    }

    const out=document.createElement('canvas');
    out.className='col';
    out.width=Math.max(1,Math.ceil(maxW*zoom));
    out.height=Math.max(1,Math.ceil(used*zoom));
    out.style.width=out.width+'px';
    out.style.height=out.height+'px';
    const oc=out.getContext('2d');
    oc.imageSmoothingEnabled=true;
    oc.imageSmoothingQuality='high';
    oc.fillStyle='#fff';
    oc.fillRect(0,0,out.width,out.height);

    for(const ch of chunks){
      const dw=Math.ceil(ch.src.sw*zoom);
      const dh=Math.ceil(ch.sourceH*zoom);
      const dx=Math.floor((out.width-dw)/2);
      const dy=Math.round(ch.destY*zoom);
      oc.drawImage(c,ch.src.sx,ch.sourceY,ch.src.sw,ch.sourceH,dx,dy,dw,dh);
    }
    reader.appendChild(out);
    outCount++;
  }
  return outCount;
}

function reflow(){
  if(!sourceCanvas)return;
  const c=sourceCanvas;
  const top=+$('topCrop').value/100;
  const bottom=+$('bottomCrop').value/100;
  const y0=Math.round(c.height*top);
  const y1=Math.round(c.height*(1-bottom));
  const h=Math.max(1,y1-y0);
  const cols=findColumns(c,y0,h);
  const zoom=+$('zoom').value/100;
  const gap=+$('gap').value;
  const usableH=Math.max(180,main.clientHeight-16);

  if(!cols.length){
    reader.innerHTML='<div class="placeholder">本文の列を認識できませんでした。<br>⚙から上下の除外率または列を分ける感度を変更してください。</div>';
    return;
  }

  const sourceCols=buildSourceColumns(c,cols,y0,y1);
  const count=renderFlow(c,sourceCols,zoom,usableH,gap);
  if(!count){
    reader.innerHTML='<div class="placeholder">本文を再配置できませんでした。</div>';
    return;
  }

  // 縦書きなのでページの右端から読み始める。
  requestAnimationFrame(()=>{main.scrollLeft=Math.max(0,main.scrollWidth-main.clientWidth);});
}

// 右スワイプで次ページ、左スワイプで前ページ。
// 本文内の横スクロールと競合しないよう、ページ端にいるときだけページ移動する。
main.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  const t=e.touches[0];
  touchStart={
    x:t.clientX,
    y:t.clientY,
    time:Date.now(),
    scrollLeft:main.scrollLeft,
    maxScroll:Math.max(0,main.scrollWidth-main.clientWidth)
  };
},{passive:true});

main.addEventListener('touchend',e=>{
  if(!touchStart||!e.changedTouches.length)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-touchStart.x;
  const dy=t.clientY-touchStart.y;
  const dt=Date.now()-touchStart.time;
  const startScroll=touchStart.scrollLeft;
  const maxScroll=touchStart.maxScroll;
  touchStart=null;
  if(dt>900||Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.25)return;

  const noOverflow=maxScroll<=6;
  if(dx>0&&(noOverflow||startScroll<=10)){
    go(1);
  }else if(dx<0&&(noOverflow||startScroll>=maxScroll-10)){
    go(-1);
  }
});

window.addEventListener('resize',()=>{
  clearTimeout(timer);
  timer=setTimeout(()=>sourceCanvas&&reflow(),180);
});

window.addEventListener('pagehide',saveState);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')saveState();
});

async function restoreLastBook(){
  try{
    const saved=await loadPdfFromDevice();
    if(!saved||!saved.blob)return;
    toast('前回のPDFを復元中…');
    const data=await saved.blob.arrayBuffer();
    pdf=await pdfjsLib.getDocument({data}).promise;
    currentFileName=saved.name||readSavedState().fileName||'保存したPDF';
    $('fileLabel').textContent=currentFileName;
    const state=readSavedState();
    const restoredPage=Number(state.pageNo)||1;
    pageNo=Math.max(1,Math.min(pdf.numPages,Math.round(restoredPage)));
    await renderPage();
    toast('前回の続きから再開しました');
  }catch(e){
    console.error(e);
    // 保存データが壊れていても、新しいPDFは通常どおり選択できる。
    toast('保存したPDFを復元できませんでした');
  }
}

requestPersistentStorage();
restoreLastBook();
</script>
